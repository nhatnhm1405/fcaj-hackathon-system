
  <!DOCTYPE html>
  <html lang="en" class="dark" data-theme="dark">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
      <link rel="icon" type="image/png" href="/favicon.png?v=2" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
      <title>SEAL Hackathon</title>
      <meta name="description" content="Manage hackathons effortlessly with a pixel-inspired platform featuring event management, team collaboration, and real-time leaderboards for participants." />
      <meta name="robots" content="noindex, nofollow" />
      <script>
        (() => {
          const url = new URL(location.href);
          const preview = url.searchParams.get("theme");
          let theme = "dark";
          try {
            if (localStorage.getItem("seal-theme") === "light") theme = "light";
          } catch {}
          if (preview === "light" || preview === "dark") {
            theme = preview;
            url.searchParams.delete("theme");
            history.replaceState(history.state, "", url);
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
        })();
      </script>
      <style>
        html, body { height: 100%; margin: 0; background: var(--c-bg, #070c0f); color: var(--c-text, #f0fdf4); }
        html[data-theme="light"], html[data-theme="light"] body {
          background: var(--c-bg, #edf5f2); color: var(--c-text, #172f2b);
        }
        #root { height: 100%; }
      </style>
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
