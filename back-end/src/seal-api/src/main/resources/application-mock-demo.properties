# Activate alongside local (or test for automated tests). Business DB/auth remain
# configured by that profile; mock job state is stored in a separate local H2 DB.
server.address=127.0.0.1
app.ai.jobs.mock-store-url=jdbc:h2:file:./target/mock-demo/ai-jobs;DB_CLOSE_ON_EXIT=FALSE
app.ai.jobs.mock-worker.enabled=true
app.ai.jobs.mock-outcome=SUCCEEDED
app.ai.jobs.mock-initial-delay-ms=5000
app.ai.jobs.mock-poll-ms=5000
