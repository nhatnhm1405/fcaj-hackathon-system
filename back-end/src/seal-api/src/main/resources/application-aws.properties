# Inject environment/config from the runtime. This profile never imports .env.
# Standard SPRING_DATASOURCE_USERNAME/PASSWORD override the compatible DB_* aliases.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Versioned migrations own DDL. A non-empty DB without history fails safely.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
app.frontend.url=${APP_FRONTEND_URL:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.frontend.url}}
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# No demo/administrator credentials are enabled automatically in this profile.
app.seed.scenario=${SEED_SCENARIO:NONE}

app.storage.provider=s3
app.aws.region=${AWS_REGION:}
app.storage.bucket=${APP_STORAGE_BUCKET:}
app.storage.prefix=${APP_STORAGE_PREFIX:}
# Opt in after BE2 grants identities and an isolated queue pair for the agreed worker.
app.ai.jobs.enabled=${APP_AI_JOBS_ENABLED:false}
app.ai.jobs.jobs-queue-url=${APP_AI_JOBS_JOBS_QUEUE_URL:}
app.ai.jobs.results-queue-url=${APP_AI_JOBS_RESULTS_QUEUE_URL:}
