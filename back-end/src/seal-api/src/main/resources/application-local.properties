# The only profile that imports a gitignored .env file (properties syntax).
spring.config.import=optional:file:./.env[.properties]

# SPRING_DATASOURCE_* environment variables override these values when supplied.
spring.datasource.url=jdbc:mysql://localhost:3306/seal_hackathon?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Public DEVELOPMENT-ONLY key. The aws profile has no signing-key fallback.
app.jwt.secret=${JWT_SECRET:bG9jYWwtZGV2LW9ubHktZG8tbm90LXVzZS1pbi1hd3M=}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,${app.frontend.url}}
