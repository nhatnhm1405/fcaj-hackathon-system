# Activated via -Dspring.profiles.active=test. No local .env, MySQL or OAuth network.
# YEAR and VALUE are existing MySQL column names, but reserved keywords in H2.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS0zMi1ieXRlcw==
app.frontend.url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
app.oauth2.enabled=false
app.bootstrap.admin.enabled=false
app.seed.scenario=NONE
