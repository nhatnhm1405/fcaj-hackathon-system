spring.application.name=seal-hackathon
# Explicit aws/test profiles do not load local configuration or its .env import.
spring.profiles.default=local

# Preparation stage DB-03: enable only with reviewed V1 and SQL-managed profiles.
# This prevents the dependency addition from touching an existing local database.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
app.storage.provider=local
app.ai.jobs.enabled=false
app.build.revision=${APP_BUILD_REVISION:unknown}
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# Common schema mappings; each environment chooses its datasource and DDL policy.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Reference roles/templates are always seeded. Admin and demo data are opt-in.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.seed.scenario=${SEED_SCENARIO:NONE}

# JWT is Base64-encoded with at least 32 decoded bytes; validated at startup.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
app.csrf.cookie.domain=${CSRF_COOKIE_DOMAIN:}

# Add oauth-google and/or oauth-github to the active profiles to enable a provider.
# Disabled providers have no registrations and do not require credentials.
app.oauth2.enabled=false
app.frontend.url=${APP_FRONTEND_URL:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.frontend.url}}
app.password-reset.otp-expiration-minutes=${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:10}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.same-site=lax

# Existing local file storage. S3 support is a separate implementation milestone.
app.upload.dir=${UPLOAD_DIR:uploads}
app.problem.dir=${PROBLEM_DIR:protected/problems}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Optional synchronous AI integration. No model key is required at startup.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.github.token=${GITHUB_TOKEN:}
app.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}

# SMTP credentials are needed when email is used, not to start the application.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
