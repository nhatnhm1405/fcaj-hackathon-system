AWSTemplateFormatVersion: '2010-09-09'
Description: SEAL v3 edge. Deploy in us-east-1 only (CloudFront certificate and WAF scope).
Parameters:
  DomainName:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  WebBucketDomain:
    Type: String
    Description: WebBucketDomain output of the base stack (S3 REST endpoint).
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    AllowedPattern: '^[A-Za-z0-9]+$'
    Description: Same value as in runtime.yaml.
  EnableWaf:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  WafMode:
    Type: String
    Default: Count
    AllowedValues: [Count, Block]
    Description: Start with Count, read sampled requests, then switch to Block.
Conditions:
  UseWaf: !Equals [!Ref EnableWaf, 'true']
  Blocking: !Equals [!Ref WafMode, Block]
Rules:
  CloudFrontRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy this stack in us-east-1.
Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: [{DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}]
  SpaFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: fcaj-v3-spa
      AutoPublish: true
      FunctionConfig: {Comment: SPA deep links for the S3 behavior only, Runtime: cloudfront-js-2.0}
      # Replaces the PoC 403/404 -> index.html rule, which would also rewrite API errors.
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: fcaj-v3-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseWaf
    Properties:
      Name: fcaj-v3
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: fcaj-v3}
      Rules:
        - Name: ip-reputation
          Priority: 0
          OverrideAction: !If [Blocking, {None: {}}, {Count: {}}]
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation}
        - Name: known-bad-inputs
          Priority: 1
          OverrideAction: !If [Blocking, {None: {}}, {Count: {}}]
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: known-bad-inputs}
        - Name: common
          Priority: 2
          OverrideAction: !If [Blocking, {None: {}}, {Count: {}}]
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # Uploads are allowed up to 20 MB by the application.
              RuleActionOverrides: [{Name: SizeRestrictions_BODY, ActionToUse: {Count: {}}}]
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common}
        - Name: login-rate
          Priority: 3
          Action: !If [Blocking, {Block: {}}, {Count: {}}]
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              # A classroom shares one public IP; raise this before a contest.
              Limit: 300
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: {UriPath: {}}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /oauth2/
                        TextTransformations: [{Priority: 0, Type: NONE}]
                    - ByteMatchStatement:
                        FieldToMatch: {UriPath: {}}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /login/
                        TextTransformations: [{Priority: 0, Type: NONE}]
                    - ByteMatchStatement:
                        FieldToMatch: {UriPath: {}}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/auth/
                        TextTransformations: [{Priority: 0, Type: NONE}]
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: login-rate}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: SEAL v3
        Enabled: true
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_200
        WebACLId: !If [UseWaf, !GetAtt WebAcl.Arn, !Ref 'AWS::NoValue']
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: web
            DomainName: !Ref WebBucketDomain
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Sub origin.${DomainName}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
            OriginCustomHeaders: [{HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginSecret}]
        # Managed policies: CachingOptimized 658327ea, CachingDisabled 4135ea2d, AllViewer 216adef6, SecurityHeaders 67f7725c.
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt SpaFunction.FunctionARN}]
        # Do not widen to /oauth2/* or /login/*: React owns /oauth2/redirect and /login.
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /oauth2/authorization/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          - PathPattern: /login/oauth2/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          - PathPattern: /uploads/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
  AliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
  AliasAaaa:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
Outputs:
  DistributionId: {Value: !Ref Distribution}
